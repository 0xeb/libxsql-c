name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*", "V*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
          - os: Windows
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Configure the full public surface: the static library with the vendored
      # SQLite amalgamation plus the thin-client HTTP server/client (vendored
      # civetweb). This compiles every shipped translation unit.
      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DXSQLC_WITH_THINCLIENT=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release

  # A version tag publishes a source-only GitHub Release once all three builds
  # pass. Replace the generated notes afterwards with `gh release edit`.
  publish-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: libxsql-c ${{ github.ref_name }}
          generate_release_notes: true
